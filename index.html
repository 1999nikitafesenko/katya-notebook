<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EDE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1718" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Блокнот">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Катин блокнот</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@500;700&family=JetBrains+Mono:ital@0;1&display=swap">
</head>
<body>
<style>
/* Layout: one-column phone app, large title per tab, fixed bottom tab bar, bottom sheets for forms.
   Palette: muted pastels on warm beige; four skins (pudra = dusty rose default, denim, cocoa, pine), each with a dark twin */
:root{
  --bg:#F4EDE9; --surface:#FFFBF9; --ink:#3A2E2F; --muted:#8A7774; --line:#E8DCD7;
  --accent:#B0707B; --accent-ink:#FFFFFF; --accent-soft:#F2E1E2;
  --in:#5E8C61; --out:#B5574B; --warn:#9C6A2A; --warn-soft:#F5E8D3;
  --scrim:rgba(40,28,28,.36);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --body:"Onest",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  /* planner paper stays light in both themes, like a real notebook */
  --skin-bg:#F4EDE9; --skin-accent:#B0707B; --head:#F2E1E2; --paper:#FFFFFF; --paper-ink:#262122; --paper-line:#E6E1DD; --paper-muted:#8C807C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1718; --surface:#292122; --ink:#F2E8E6; --muted:#B3A19E; --line:#3A3031;
  --accent:#D69FA7; --accent-ink:#1D1718; --accent-soft:#432F32;
  --in:#8DBF90; --out:#E08A7E; --warn:#DDAE6C; --warn-soft:#3A2F1E;
  --scrim:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1D1718; --surface:#292122; --ink:#F2E8E6; --muted:#B3A19E; --line:#3A3031;
  --accent:#D69FA7; --accent-ink:#1D1718; --accent-soft:#432F32;
  --in:#8DBF90; --out:#E08A7E; --warn:#DDAE6C; --warn-soft:#3A2F1E;
  --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
:root[data-skin="denim"]{--skin-bg:#F0EEE9;--skin-accent:#5B7C9C;--bg:#F0EEE9;--surface:#FFFEFB;--ink:#28313A;--muted:#707982;--line:#E0DED8;--accent:#5B7C9C;--accent-ink:#FFFFFF;--accent-soft:#E2E9F0;--head:#DCE5EE}
:root[data-skin="cocoa"]{--skin-bg:#F3ECE3;--skin-accent:#8A6950;--bg:#F3ECE3;--surface:#FFFBF5;--ink:#3B2F27;--muted:#85766A;--line:#E5DACC;--accent:#8A6950;--accent-ink:#FFFFFF;--accent-soft:#EEE2D4;--head:#EADCCB}
:root[data-skin="pine"]{--skin-bg:#EEEFE8;--skin-accent:#4D6D57;--bg:#EEEFE8;--surface:#FDFDF8;--ink:#263029;--muted:#6E786F;--line:#DDE1D6;--accent:#4D6D57;--accent-ink:#FFFFFF;--accent-soft:#E0EAE1;--head:#DCE6DA}
@media (prefers-color-scheme: dark){
  :root[data-skin="denim"]:not([data-theme="light"]){--bg:#161B20;--surface:#20272E;--ink:#E9EEF2;--muted:#9AA6B1;--line:#2F3841;--accent:#93B1CF;--accent-ink:#161B20;--accent-soft:#263445}
  :root[data-skin="cocoa"]:not([data-theme="light"]){--bg:#1C1713;--surface:#28211B;--ink:#F1E9E0;--muted:#B2A496;--line:#3A3027;--accent:#C9A27F;--accent-ink:#1C1713;--accent-soft:#3E3125}
  :root[data-skin="pine"]:not([data-theme="light"]){--bg:#151A17;--surface:#1F2621;--ink:#E7EEE8;--muted:#9BA89E;--line:#2E3830;--accent:#8FB59A;--accent-ink:#151A17;--accent-soft:#26372B}
}
:root[data-skin="denim"][data-theme="dark"]{--bg:#161B20;--surface:#20272E;--ink:#E9EEF2;--muted:#9AA6B1;--line:#2F3841;--accent:#93B1CF;--accent-ink:#161B20;--accent-soft:#263445}
:root[data-skin="cocoa"][data-theme="dark"]{--bg:#1C1713;--surface:#28211B;--ink:#F1E9E0;--muted:#B2A496;--line:#3A3027;--accent:#C9A27F;--accent-ink:#1C1713;--accent-soft:#3E3125}
:root[data-skin="pine"][data-theme="dark"]{--bg:#151A17;--surface:#1F2621;--ink:#E7EEE8;--muted:#9BA89E;--line:#2E3830;--accent:#8FB59A;--accent-ink:#151A17;--accent-soft:#26372B}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:linear-gradient(var(--bg-veil,transparent),var(--bg-veil,transparent)) fixed,var(--bg-img,none) center/cover fixed,var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
h1{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.005em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

.month{display:flex;align-items:center;gap:4px}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:15px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.icon-btn:active{background:var(--accent-soft)}

.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.group > * + *{border-top:1px solid var(--line)}

/* money */
.summary{background:var(--surface);border-radius:20px;padding:18px}
.summary .label{font-size:13px;color:var(--muted)}
.summary .big{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.02em;margin:2px 0 14px;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--tile,var(--bg));border-radius:12px;padding:10px 12px;min-width:0}
.split b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.split .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--in)} .neg{color:var(--out)}
.brk{margin:-8px 0 14px;font-size:13px;color:var(--muted)}
.setup-q{font-family:var(--display);font-weight:500;font-size:20px;margin:4px 0 8px;text-wrap:balance}
.nextcard{margin-top:12px;background:var(--surface);border-radius:20px;padding:16px 18px;display:grid;gap:8px;border:1.5px dashed color-mix(in srgb,var(--accent) 40%,var(--line))}
.nextcard .line1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.nextcard .line1 b{font-family:var(--display);font-size:20px}
.nextcard small{font-size:13px;color:var(--muted)}
.nextcard small b{color:var(--ink)}
.nextcard small.pos{color:var(--in)}
.nextcard .due{margin:0;font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.nextcard .neutral{background:var(--accent-soft);color:var(--accent);margin-top:4px}
.nextcard .neutral.armed{background:var(--accent);color:var(--accent-ink)}
.icon-btn:disabled{opacity:.35}
.free-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.free-row > div{min-width:0}
.free-row b{display:block;font-size:17px;font-weight:600}
.budget-row{padding:12px 14px;display:grid;gap:7px;width:100%;border:0;background:none;text-align:left}
.budget-row .line1{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.st{font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.ok{color:var(--in);background:color-mix(in srgb,var(--in) 14%,transparent)}
.st.need{color:var(--warn);background:var(--warn-soft)}
.st.over{color:var(--out);background:color-mix(in srgb,var(--out) 13%,transparent)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.bar i.al{background:color-mix(in srgb,var(--accent) 38%,transparent)}
.bar i.sp{background:var(--accent)}
.bar i.sp.over{background:var(--out)}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.budget-row small{font-size:13px;color:var(--muted)}
.freebox{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.freebox b{color:var(--ink);font-size:17px}
.freebox b.neg{color:var(--out)}
.alloc-row{display:grid;grid-template-columns:1fr auto 110px;gap:8px;align-items:center;padding:10px 10px 10px 14px}
.alloc-row .nm{min-width:0}
.alloc-row b{display:block;font-weight:600;overflow-wrap:anywhere}
.alloc-row small{display:block;font-size:13px;color:var(--muted)}
.alloc-row input{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;font-size:16px;text-align:right;font-weight:600}
.fill{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;padding:6px 10px;white-space:nowrap}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;padding:6px 4px}
.h2row{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.h2row h2{margin:0 4px}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border:0;background:none;text-align:left}
.tx .dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px}
.tx .dot.in{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.tx .dot.out{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap}
.empty{background:var(--surface);border-radius:var(--r);padding:22px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* clients */
.search{width:100%;border:0;border-radius:12px;background:var(--surface);padding:11px 14px;font-size:16px;margin-bottom:12px}
.client{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 10px 10px 14px}
.cname{border:0;background:none;text-align:left;padding:4px 0;min-width:0}
.cname b{display:block;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.cname small{display:block;font-size:13px;color:var(--muted)}
.cname small.today{color:var(--warn)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:0;font-size:24px;font-weight:500;line-height:1;display:grid;place-items:center}
.stepper .dec{background:var(--accent-soft);color:var(--accent)}
.stepper .inc{background:var(--bg);color:var(--ink)}
.stepper button:active{transform:scale(.94)}
.stepper input{width:56px;height:44px;text-align:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input.low{color:var(--warn);border-color:var(--warn)}
.stepper input.zero{color:var(--out);border-color:var(--out)}
.confirm{grid-column:1/-1;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.confirm span{flex:1 1 180px}
.confirm button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.confirm .yes{background:var(--warn);color:var(--surface)}
.confirm .no{background:var(--surface);color:var(--ink)}
.more{width:34px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;font-weight:700;border-radius:10px;padding:0}
.more:active{background:var(--bg)}
.seg3{grid-template-columns:repeat(3,1fr)}
.wk{display:grid;gap:4px;padding:12px 14px;width:100%;border:0;background:none;text-align:left}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.wk-h b{color:var(--ink);font-weight:600}
.wk .x{width:30px;height:30px;font-size:20px;border:0;background:none;color:var(--muted)}
.wt{white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.wt.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.field textarea{resize:vertical;line-height:1.45;min-height:120px}
.checkrow{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px}
.checkrow input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.filebtn{position:relative;display:block;text-align:center;cursor:pointer;color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.group > .note-row + .note-row{border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.note-row{display:grid;gap:2px;width:100%;border:0;background:none;text-align:left;padding:11px 14px}
.note-row b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row small{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row small .num{color:var(--ink);margin-right:6px}
.note-ta{width:100%;border:0;background:transparent;resize:none;font-size:17px;line-height:1.5;padding:4px 2px;outline:none;color:var(--ink);overflow:hidden}
.pill-btn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px;font-size:15px}

/* appearance picker */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tone{background:var(--surface);border-radius:16px;padding:12px 14px 6px;margin-bottom:12px;display:grid;gap:4px}
.tone label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}
.tone label small{font-weight:400;font-size:12px;color:var(--muted)}
.tone input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 10px;height:28px}
.tone .link-btn{justify-self:start;color:var(--out);padding:4px 0 6px}
.tone .link-btn.armed{font-weight:700}
.skins.mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skins.mini .skin{padding:7px;gap:5px;border-radius:13px}
.skins.mini .skin b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skins.mini .skin-prev{grid-template-rows:16px 16px;gap:4px;padding:5px;border-radius:8px}
.skin-group{margin:16px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skin{border:2px solid transparent;border-radius:16px;background:var(--surface);padding:10px;display:grid;gap:8px;text-align:left}
.skin.on{border-color:var(--accent)}
.skin b{font-family:var(--display);font-weight:600;font-size:17px}
.skin-prev{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:28px 28px;gap:6px;background:var(--sbg);background-size:cover;border-radius:10px;padding:8px}
.skin-prev i{border-radius:6px;background:#FFFFFF}
.skin-prev i:first-child{grid-row:span 2;background:var(--ssoft)}
.skin-prev i:last-child{background:var(--sac)}
.lbl.def{color:var(--accent-ink)}
.ev.def .check{color:var(--accent-ink)}
/* planner week */
.wk-title{flex:1;display:grid;text-align:center;line-height:1.2}
.wk-title b{font-weight:600}
.wk-title small{font-size:12px;color:var(--muted)}
.wk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-items:start}
.wk-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-grid{align-items:stretch}
.pday.short{flex:1;display:flex;flex-direction:column}
.pday.short .pday-b{flex:1 1 0;height:0;min-height:38px}
.wk-copy{flex:none;border:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);background:transparent;color:color-mix(in srgb,var(--muted) 70%,transparent);border-radius:12px;padding:7px 8px;font-weight:600;font-size:13px}
.wk-copy.armed{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pday{position:relative;cursor:pointer;display:block;width:100%;border:0;padding:0;text-align:left;background:var(--paper-img,none),var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--paper-ink)}
.pday-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px 4px 10px;background:var(--head-img,none),var(--head);color:var(--paper-ink);font-size:12.5px;white-space:nowrap}
.pday-h > span{overflow:hidden;text-overflow:ellipsis}
.pday-h b{font-weight:700}
.pday-h svg{width:16px;height:16px;flex:none;color:var(--paper-muted)}
.pday.today .pday-h{box-shadow:inset 0 -2px 0 var(--out)}
.pday.we .pday-h b{color:var(--out)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--out);margin-right:5px;vertical-align:2px}
.pday-b{display:block;height:var(--pday-h,168px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 8px 2px;font-size:11px;line-height:18px;background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--paper-line) 17px 18px);background-origin:content-box;background-attachment:local}
.pday-b::-webkit-scrollbar{display:none}
.pday.short .pday-b{height:auto}
.pday-more{position:absolute;right:6px;bottom:6px;width:30px;height:22px;border:0;border-radius:11px;background:var(--out);color:#fff;font-size:16px;line-height:12px;padding:0 0 4px;opacity:0;pointer-events:none;transition:opacity .15s}
.pday.has-more .pday-more{opacity:.9;pointer-events:auto}
.pp{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;height:18px}
.pl{display:block;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{background:color-mix(in srgb,var(--c) 30%,transparent);border-radius:3px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pl.done .hl{opacity:.7}
.pnote{display:block;max-height:76px;overflow:hidden;font-size:11px;line-height:19px}
.pnote ul{margin:0;padding-left:16px}
.pnote div,.pnote p{margin:0}
.dsec{margin-bottom:16px}
.dsec h4{margin:0 4px 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dn-i{width:20px;flex:none;color:var(--muted);font-size:14px;text-align:right}
.dtext{flex:1;min-width:0;border:0;border-radius:10px;padding:10px 12px;font-size:16px;background:color-mix(in srgb,var(--c) 26%,var(--surface))}

  {id:'ads',name:'Реклама',limit:0},{id:'transport',name:'Транспорт',limit:0},{id:'other',name:'Прочее',limit:0}];
const LS_KEY='katya-notebook-v1';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseDay=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const monthName=key=>{const [y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y};
const shiftMonth=(key,n)=>{const [y,m]=key.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function plural(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2]}
function when(ts){
  if(!ts) return 'ещё не менялось';
  const d=new Date(ts),now=new Date(),min=(now-d)/60000;
  if(min<1) return 'только что';
  if(min<60) return Math.floor(min)+' мин назад';
  if(ymd(d)===ymd(now)) return 'сегодня в '+hm(d);
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(ymd(d)===ymd(y)) return 'вчера в '+hm(d);
  return d.getDate()+' '+MG[d.getMonth()]+' в '+hm(d);
}
const dayTitle=s=>{const d=parseDay(s);return d.getDate()+' '+MG[d.getMonth()]+', '+WD[d.getDay()]};

/* ---------- storage: shared db when available, otherwise this browser ---------- */
const Back={
  db:null, queue:{},
  async init(){
    let db=null;
    try{ if(window.claude&&window.claude.use) db=await window.claude.use('db'); }catch(e){}
    if(db){
      this.db=db; S.mode='db';
      for(const col of ['tx','clients','tasks','alloc','workouts','daynotes','notes']){
        db.collection(col).onSnapshot(snap=>{
          const m={};snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});
          S.data[col]=m;render();
        },e=>toast('Не удалось загрузить данные ('+e.code+'). Обновите страницу.'));
      }
      db.doc('settings/budget').onSnapshot(s=>{S.data.budget=s.exists?s.data():null;render()},()=>{});
      db.doc('settings/flow').onSnapshot(s=>{S.data.flow=s.exists?s.data():null;render()},()=>{});
    }else{
      S.mode='local';
      try{const raw=localStorage.getItem(LS_KEY);if(raw)Object.assign(S.data,JSON.parse(raw))}catch(e){}
      autoSnapshot();
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    }
    render();
  },
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.data))}catch(e){toast('Не удалось сохранить на телефоне. Сохраните резервную копию.')}},
  write(path,fn){
    this.queue[path]=(this.queue[path]||Promise.resolve()).then(fn).catch(e=>{
      toast(e&&e.code==='invalid_argument'?'Нет прав на изменение. Попросите доступ «Редактор».':'Не сохранилось, проверьте интернет.');
    });
  },
  put(col,id,obj){
    const body={...obj};delete body.id;
    S.data[col]={...S.data[col],[id]:{...body,id}};
    render();
    if(this.db) this.write(col+'/'+id,()=>this.db.doc(col+'/'+id).set(body));
    else this.saveLocal();
  },
  putMany(col,items){
    const m={...S.data[col]};for(const [id,obj] of items)m[id]={...obj,id};S.data[col]=m;render();
    if(this.db) for(const [id,obj] of items) this.write('bulk:'+col,()=>this.db.doc(col+'/'+id).set(obj));
    else this.saveLocal();
  },
  del(col,id){
    const m={...S.data[col]};delete m[id];S.data[col]=m;render();
    if(this.db) this.write(col+'/'+id,()=>this.db.doc(col+'/'+id).delete());
    else this.saveLocal();
  },
  // delete every record; in the shared store this clears it for everyone who opens the app
  wipe(){
    if(this.db){
      for(const col of ['tx','clients','tasks','alloc','workouts','daynotes','notes'])for(const id of Object.keys(S.data[col]||{}))this.write('wipe',()=>this.db.doc(col+'/'+id).delete());
      for(const d of ['settings/budget','settings/flow'])this.write('wipe',()=>this.db.doc(d).delete());
    }
    S.data={tx:{},clients:{},tasks:{},alloc:{},workouts:{},daynotes:{},notes:{},budget:null,flow:null};
    if(!this.db)this.saveLocal();
  },
  putFlow(f){
    S.data.flow=f;render(true);
    if(this.db) this.write('settings/flow',()=>this.db.doc('settings/flow').set(f));
    else this.saveLocal();
  },
  putBudget(b){
    S.data.budget=b;render();
    if(this.db) this.write('settings/budget',()=>this.db.doc('settings/budget').set(b));
    else this.saveLocal();
  }
};
const getCats=()=>(S.data.budget&&S.data.budget.cats)||DEFAULT_CATS;
function getAlloc(key){
  const raw=(S.data.alloc[key]&&S.data.alloc[key].byCat)||{}, alloc={};let allocTotal=0;
  for(const c of getCats()){const v=+raw[c.id]||0;if(v){alloc[c.id]=v;allocTotal+=v}}
  return {alloc,allocTotal};
}
const TAX_CAT={id:'tax',name:'Налог самозанятого'};
const getTaxRate=()=>{const r=S.data.budget&&S.data.budget.taxRate;return r==null?4:+r};
const monthTax=key=>Object.values(S.data.tx).reduce((s,t)=>s+(t.type==='in'&&(t.date||'').startsWith(key)?+t.tax||0:0),0);
const r2=n=>Math.round(n*100)/100;
// Self-employed tax for a month is billed after the month ends: earlier months are payable now, the current one is still accruing
function taxDue(){
  const curKey=today().slice(0,7), byMonth={};let acc=0,accPrev=0,paid=0;const payments=[];
  for(const t of Object.values(S.data.tx)){
    if(t.type==='in'&&+t.tax){const k=(t.date||'').slice(0,7);acc+=+t.tax;byMonth[k]=(byMonth[k]||0)+ +t.tax;if(k<curKey)accPrev+=+t.tax}
    else if(t.type==='out'&&t.cat==='tax'){paid+=+t.amount||0;payments.push(t)}
  }
  const due=r2(acc-paid), dueNow=r2(Math.max(0,accPrev-paid));
  payments.sort((a,b)=>b.date.localeCompare(a.date));
  return {acc,paid,due,dueNow,cur:r2(Math.max(0,due-dueNow)),byMonth,payments};
}
const isSave=c=>true; // every list is a piggy bank
function saveBalance(id){
  let a=0;for(const m of Object.values(S.data.alloc))a+=+(m.byCat&&m.byCat[id])||0;
  for(const t of Object.values(S.data.tx))if(t.type==='out'&&t.cat===id)a-=+t.amount||0;
  return a;
}
/* Budget months: money earned during a month funds the next one. Each operation remembers
   the budget month it was recorded in (m) and, for income, the month it funds (for). */
const nextKey=k=>shiftMonth(k,1);
const txM=t=>t.m||(t.date||'').slice(0,7);
const txFor=t=>t.for||nextKey((t.date||'').slice(0,7));
const getFlow=()=>S.data.flow||null;
const activeMonth=()=>(getFlow()&&getFlow().active)||today().slice(0,7);
const firstMonth=()=>{const s=getFlow()&&getFlow().starts;return s?Object.keys(s).sort()[0]||null:null};
const monthSpent=(key,cat)=>Object.values(S.data.tx).reduce((s,t)=>s+(t.type==='out'&&t.cat===cat&&txM(t)===key?+t.amount||0:0),0);
function collected(key){
  let inc=0,tax=0,cash=0,card=0;
  for(const t of Object.values(S.data.tx))if(t.type==='in'&&txFor(t)===key){const a=+t.amount||0;inc+=a;tax+=+t.tax||0;if(t.pay==='card')card+=a;else cash+=a}
  return {inc,tax,net:r2(inc-tax),cash,card};
}
function spentBudget(key){
  const sv=new Set(getCats().filter(isSave).map(c=>c.id));let s=0;
  for(const t of Object.values(S.data.tx))if(t.type==='out'&&txM(t)===key&&t.cat!=='tax'&&!sv.has(t.cat))s+=+t.amount||0;
  return s;
}
function allocSave(key){const {alloc}=getAlloc(key);return getCats().filter(isSave).reduce((s,c)=>s+(alloc[c.id]||0),0)}
// total = start amount (first month only) + money collected for this month + what was left of the previous one
function budgetOf(key){
  const f=firstMonth();if(!f||key<f)return {total:0,start:0,net:0,carry:0};
  const starts=getFlow().starts;let carry=0,k=f;
  for(;;){
    const st=+(starts[k]||0),net=collected(k).net,total=r2(st+net+carry);
    if(k>=key)return {total,start:st,net,carry};
    carry=r2(total-allocSave(k)-spentBudget(k));k=nextKey(k);
  }
}

/* ---------- render ---------- */
function editing(){const a=document.activeElement;return a&&$('#view').contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)}
function render(force){
  if(!force&&editing()){S.dirty=true;return}
  S.dirty=false;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  $('#fab').hidden=S.tab!=='money';
  const bn=$('#banner');
  const last=lastBackup(), hasData=Object.keys(S.data.tx).length+Object.keys(S.data.clients).length+Object.keys(S.data.tasks).length>0;
  bn.hidden=!(S.mode==='local'&&hasData&&(!last||Date.now()-last>7*864e5));
  if(!bn.hidden)bn.innerHTML=`${last?'Последняя резервная копия '+when(last)+'.':'Резервной копии ещё не было.'} Все данные хранятся только на этом телефоне. <button class="link-btn" data-act="backup-save" style="padding:2px 0;color:inherit;text-decoration:underline">Сохранить копию</button>`;
  const keep={};document.querySelectorAll('.pday-b').forEach(b=>keep[b.dataset.sday]=b.scrollTop);
  $('#view').innerHTML=S.tab==='money'?viewMoney():S.tab==='clients'?viewClients():S.tab==='notes'?viewNotes():viewTasks();
  document.querySelectorAll('.pday-b').forEach(b=>{if(keep[b.dataset.sday])b.scrollTop=keep[b.dataset.sday];updMore(b)});
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!editing())render()},0));
setInterval(()=>render(),60000);

/* ---------- money ---------- */
function viewMoney(){
  // the page shows the budget for next month, built from what is earned this month; arrows go back in time
  const def=nextKey(today().slice(0,7));
  if(!S.month||S.month>def)S.month=def;
  const key=S.month,isNext=key===def,prev=shiftMonth(key,-1);
  const list=Object.values(S.data.tx).filter(t=>t.type==='in'?txFor(t)===key:txM(t)===key)
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const spent={};
  for(const t of list)if(t.type==='out'){const a=+t.amount||0;spent[t.cat||'_']=(spent[t.cat||'_']||0)+a}
  const cats=getCats(),{alloc}=getAlloc(key),mTax=monthTax(prev),tax=taxDue(),C=collected(key);
  const mi=k=>+k.slice(5)-1;
  let h=`<div class="top"><h1>Деньги</h1><div class="month">
    <button class="icon-btn" data-act="m-prev" aria-label="Прошлый месяц">‹</button><span>${monthName(key)}</span>
    <button class="icon-btn" data-act="m-next" aria-label="Следующий месяц" ${isNext?'disabled':''}>›</button></div></div>
  <section class="summary"><div class="label">Бюджет на ${MONTHS[mi(key)].toLowerCase()}</div>
    <div class="big num">${rub(C.inc)}</div>
    ${C.card?`<p class="brk num">нал ${rub(C.cash)} · безнал ${rub(C.card)}</p>`:''}
    <p class="brk" style="margin:0">Заработано за ${MONTHS[mi(prev)].toLowerCase()}${isNext?' · копится сейчас':''}</p></section>
  <div class="h2row"><h2>Списки</h2><span><button class="link-btn" data-act="alloc">Распределить</button> <button class="link-btn" data-act="budget">Изменить</button></span></div>
  <div class="group">`;
  if(tax.acc||mTax){
    h+=`<button class="budget-row" data-act="tax">
      <div class="line1"><span>${TAX_CAT.name} · ${getTaxRate()}%</span>${tax.dueNow>0?`<span class="st need">К оплате ${rub(tax.dueNow)}</span>`:tax.cur>0?`<span class="st plain num">${rub(tax.cur)}</span>`:`<span class="st ok">Оплачено</span>`}</div></button>`;
  }
  const rows=cats.map(c=>({...c,sp:spent[c.id]||0,a:alloc[c.id]||0}));
  const known=new Set([...cats.map(c=>c.id),'tax']);
  const orphan=Object.entries(spent).filter(([k])=>!known.has(k)).reduce((s,[,v])=>s+v,0);
  if(orphan) rows.push({id:'_',name:'Без категории',limit:0,sp:orphan,a:0});
  for(const c of rows){
    if(isSave(c)){
      const bal=saveBalance(c.id);
      h+=`<button class="budget-row" data-act="env" data-cat="${esc(c.id)}">
        <div class="line1"><span>${esc(c.name)}</span><span class="st plain num ${bal<0?'neg':''}">${bal<0?'−':''}${rub(Math.abs(bal))}</span></div></button>`;
      continue;
    }
    const lim=+c.limit||0, scale=Math.max(lim,c.a,c.sp)||1, overSpent=c.sp>c.a;
    let st;
    if(overSpent) st=`<span class="st over">Потрачено сверх на ${rub(c.sp-c.a)}</span>`;
    else if(lim&&c.a>=lim) st=`<span class="st ok">Хватает</span>`;
    else if(lim) st=`<span class="st need">Не хватает ${rub(lim-c.a)}</span>`;
    else st='';
    h+=`<button class="budget-row" ${c.id==='_'?'':`data-act="env" data-cat="${esc(c.id)}"`}>
      <div class="line1"><span>${esc(c.name)}</span>${st}</div>
      <div class="bar"><i class="al" style="width:${c.a/scale*100}%"></i><i class="sp ${overSpent?'over':''}" style="width:${c.sp/scale*100}%"></i>${lim&&scale>lim?`<em style="left:${lim/scale*100}%"></em>`:''}</div>
      <small class="num">Отложено ${rub(c.a)}${lim?' из '+rub(lim):''} · потрачено ${rub(c.sp)}${c.a>c.sp?' · на руках '+rub(c.a-c.sp):''}</small></button>`;
  }
  h+=`</div><h2>Операции</h2>`;
  if(!list.length){
    h+=`<div class="empty"><b>За ${monthName(key).toLowerCase()} операций нет</b>Нажмите «+», чтобы записать оплату от клиента.</div>`;
  }else{
    let cur=null;
    for(const t of list){
      if(t.date!==cur){
        if(cur!==null)h+='</div>';
        cur=t.date;
        const dayIn=list.filter(x=>x.date===cur).reduce((s,x)=>s+(x.type==='in'?+x.amount:-x.amount),0);
        h+=`<div class="day-head"><span>${dayTitle(cur)}</span><span class="num">${dayIn>=0?'+':'−'}${rub(Math.abs(dayIn))}</span></div><div class="group">`;
      }
      const isIn=t.type==='in';
      const title=isIn?(t.who||'Поступление'):t.cat==='tax'?TAX_CAT.name:(cats.find(c=>c.id===t.cat)?.name||t.catName||'Расход');
      const sub=[isIn&&t.pay==='card'?'Безнал · налог '+rub(+t.tax||0):isIn&&t.pay==='cash'?'Наличные':'',t.note].filter(Boolean).join(' · ');
      h+=`<button class="tx" data-act="tx-open" data-id="${esc(t.id)}"><span class="dot ${isIn?'in':'out'}">${isIn?'+':'−'}</span>
        <span class="t"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span>
        <span class="a num ${isIn?'pos':'neg'}">${isIn?'+':'−'}${rub(+t.amount)}</span></button>`;
    }
    h+='</div>';
  }
  return h;
}

function openTx(id,preset){
  const ex=id&&S.data.tx[id];
  const nowKey=today().slice(0,7);
  let lastPay='card';try{lastPay=localStorage.getItem(LS_KEY+':pay')||'card'}catch(e){}
  const act=activeMonth(), nk=nextKey(act);
  const t=ex?{pay:'cash',...ex,for:txFor(ex)}:{type:'in',amount:'',who:'',pay:lastPay,for:nk,cat:getCats()[0]?.id||'',date:act===nowKey?today():act+'-01',note:'',...preset};
  const forOpts=[...new Set([nk,act,t.for])];
  const cats=[{id:'tax',name:'Налог'},...getCats()];
  const rate=getTaxRate();
  const names=[...new Set([...Object.values(S.data.clients).map(c=>c.name),...Object.values(S.data.tx).filter(x=>x.type==='in'&&x.who).map(x=>x.who)])].sort();
  openSheet(`<h3>${ex?'Операция':'Новая операция'}</h3>
    <label class="field"><span>Сумма, ₽</span><input id="f-amount" class="amount num" inputmode="decimal" placeholder="0" value="${esc(t.amount)}"></label>
    <div class="field" id="f-pay-wrap" ${t.type==='in'?'':'hidden'}><span>Как заплатили</span>
      <div class="seg" style="margin-bottom:0"><button data-pay="cash" class="${t.pay==='cash'?'on':''}">Наличные</button><button data-pay="card" class="${t.pay==='card'?'on':''}">Безнал</button></div>
      <p class="hint num" id="f-taxhint"></p></div>
    <label class="field" id="f-who-wrap" ${t.type==='in'?'':'hidden'}><span>От кого</span><input id="f-who" list="f-names" placeholder="Имя клиента" value="${esc(t.who)}" autocomplete="off">
      <datalist id="f-names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
    <div class="field" id="f-cat-wrap" ${t.type==='out'?'':'hidden'}><span>Куда</span><div class="chips">
      ${cats.map(c=>`<button class="chip ${c.id===t.cat?'on':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div></div>
    <div class="row2"><label class="field"><span>Дата</span><input id="f-date" type="date" value="${esc(t.date)}"></label>
    <label class="field"><span>Комментарий</span><input id="f-note" placeholder="Необязательно" value="${esc(t.note)}"></label></div>
    <div class="actions"><button class="primary" id="f-save">Сохранить</button>${ex?'<button class="secondary" id="f-del">Удалить операцию</button>':''}</div>`,
  panel=>{
    const amt=()=>parseFloat(panel.querySelector('#f-amount').value.replace(/\s/g,'').replace(',','.'));
    const hint=()=>{const a=amt(),el=panel.querySelector('#f-taxhint');
      el.textContent=t.pay==='card'?(a>0?`Налог ${rate}%: ${rub(Math.round(a*rate)/100)} уйдёт в конверт налога, свободно ${rub(a-Math.round(a*rate)/100)}`:`С безнала ${rate}% уйдёт в конверт налога`):'Налог с наличных не начисляется'};
    hint();
    panel.oninput=e=>{if(e.target.id==='f-amount')hint()};
    if(!ex) setTimeout(()=>panel.querySelector('#f-amount').focus(),250);
    panel.onclick=e=>{
      const ty=e.target.closest('[data-type]'),ca=e.target.closest('[data-cat]'),pa=e.target.closest('[data-pay]');
      const fo=e.target.closest('[data-for]');
      if(fo){t.for=fo.dataset.for;panel.querySelectorAll('[data-for]').forEach(b=>b.classList.toggle('on',b===fo))}
      if(pa){t.pay=pa.dataset.pay;panel.querySelectorAll('[data-pay]').forEach(b=>b.classList.toggle('on',b===pa));hint()}
      if(ty){t.type=ty.dataset.type;panel.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('on',b===ty));
        panel.querySelector('#f-pay-wrap').hidden=t.type!=='in';panel.querySelector('#f-for-wrap').hidden=t.type!=='in';
        panel.querySelector('#f-who-wrap').hidden=t.type!=='in';panel.querySelector('#f-cat-wrap').hidden=t.type!=='out'}
      if(ca){t.cat=ca.dataset.cat;panel.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',b===ca))}
      if(e.target.id==='f-save'){
        const amount=amt();
        if(!(amount>0)){toast('Введите сумму больше нуля');panel.querySelector('#f-amount').focus();return}
        const date=panel.querySelector('#f-date').value||today();
        const rec={type:t.type,amount:Math.round(amount*100)/100,date,note:panel.querySelector('#f-note').value.trim(),createdAt:t.createdAt||Date.now(),m:ex?txM(ex):act};
        if(t.type==='in'){
          rec.who=panel.querySelector('#f-who').value.trim();rec.pay=t.pay;rec.for=nextKey(date.slice(0,7));
          rec.tax=t.pay==='card'?(ex&&ex.pay==='card'&&+ex.amount===rec.amount&&ex.tax!=null?ex.tax:Math.round(rec.amount*rate)/100):0;
          try{localStorage.setItem(LS_KEY+':pay',t.pay)}catch(e){}
        }
        else{rec.cat=t.cat;rec.catName=t.cat==='tax'?TAX_CAT.name:cats.find(c=>c.id===t.cat)?.name||''}
        Back.put('tx',ex?id:uid(),rec);
        S.month=rec.m;

function openAlloc(focusCat){
  const key=S.month, cats=getCats(), total=collected(key).inc;
  const vals={...getAlloc(key).alloc};
  const freeNow=()=>total-cats.reduce((s,c)=>s+(vals[c.id]||0),0);
  openSheet(`<h3>Распределить: ${monthName(key).toLowerCase()}</h3>
    <div class="freebox"><span>Бюджет ${rub(total)}</span><span>Свободно <b class="num" id="a-free"></b></span></div>
    
    <div class="group" id="a-rows">${cats.map(c=>{const lim=isSave(c)?0:+c.limit||0,sp=monthSpent(key,c.id);return `<div class="alloc-row">
      <div class="nm"><b>${esc(c.name)}</b></div>
      ${lim?`<button class="fill" data-fill="${esc(c.id)}">до плана</button>`:'<span></span>'}
      <input class="num" inputmode="numeric" data-c="${esc(c.id)}" value="${vals[c.id]||''}" placeholder="0" aria-label="Отложить на ${esc(c.name)}, ₽"></div>`}).join('')}</div>
    <p class="hint">Сколько из бюджета месяца отложить на каждый список. Порядок списков меняется в «Изменить».</p>
    <div class="actions"><button class="primary" id="a-save">Сохранить</button></div>`,
  panel=>{
    const upd=()=>{const f=freeNow(),el=panel.querySelector('#a-free');el.textContent=(f<0?'−':'')+rub(Math.abs(f));el.className='num '+(f<0?'neg':'')};
    const setVal=(id,v)=>{vals[id]=Math.max(0,Math.round(v));panel.querySelector(`input[data-c="${id}"]`).value=vals[id]||''};
    upd();
    if(focusCat) setTimeout(()=>{const i=panel.querySelector(`input[data-c="${focusCat}"]`);if(i){i.focus();i.select()}},250);
    panel.oninput=e=>{const id=e.target.dataset.c;if(!id)return;vals[id]=parseInt(e.target.value.replace(/\D/g,''),10)||0;upd()};
    panel.onclick=e=>{
      const fill=e.target.dataset.fill;
      if(fill){const c=cats.find(x=>x.id===fill),gap=(+c.limit||0)-(vals[fill]||0),f=freeNow();
        if(gap<=0){toast('На этот список уже хватает');return}
        if(f<=0){toast('Свободных денег нет');return}
        setVal(fill,(vals[fill]||0)+Math.min(gap,f));upd();
        if(gap>f)toast('Не хватило '+rub(gap-f));}
      if(e.target.id==='a-auto'){
        let f=freeNow();
        for(const c of cats){if(f<=0)break;const gap=(+c.limit||0)-(vals[c.id]||0);if(gap>0){const add=Math.min(gap,f);setVal(c.id,(vals[c.id]||0)+add);f-=add}}
        upd();
        const left=cats.reduce((s,c)=>s+Math.max(0,(+c.limit||0)-(vals[c.id]||0)),0);
        toast(left?'Денег хватило не на всё: не хватает '+rub(left):'Все списки заполнены по плану');
      }
      if(e.target.id==='a-save'){
        const byCat={};for(const c of cats)if(vals[c.id])byCat[c.id]=vals[c.id];
        Back.put('alloc',key,{byCat});closeSheet();toast('Распределение сохранено');
      }
    };
  });
}

const pending={}; // debounced counter changes per client
function clientView(c){const p=pending[c.id];return p?{...c,...p.fields}:c}
const isToday=ts=>ts&&ymd(new Date(ts))===today();

        <input class="${n<=0?'zero':n<=1?'low':''}" type="number" inputmode="numeric" pattern="[0-9]*" value="${n}" data-set="${esc(c.id)}" aria-label="Осталось тренировок у ${esc(c.name)}">
        <button class="inc" data-act="inc" data-id="${esc(c.id)}" aria-label="Добавить тренировку">+</button>
      </div>
      ${S.confirm===c.id?`<div class="confirm"><span>Сегодня уже списывали в ${hm(new Date(c.lastMinusAt))}. Списать ещё одну?</span>
        <button class="no" data-act="dec-cancel">Нет</button><button class="yes" data-act="dec-force" data-id="${esc(c.id)}">Да, списать</button></div>`:''}

function changeClient(id,newVal,kind,silent){
  const base=S.data.clients[id];if(!base)return;
  const c=clientView(base);
  const prev={sessions:+c.sessions||0,lastMinusAt:c.lastMinusAt||null};
  if(newVal===prev.sessions&&kind==='set')return;
  const p=pending[id]||(pending[id]={fields:{},delta:0});
  p.fields.sessions=newVal;p.fields.updatedAt=Date.now();
  if(kind==='dec')p.fields.lastMinusAt=Date.now();
  if(kind==='undo')p.fields.lastMinusAt=silent.lastMinusAt;
  p.delta+=newVal-prev.sessions;
  clearTimeout(p.t);p.t=setTimeout(()=>flushClient(id),800);
  S.confirm=null;render();
  if(kind!=='undo'){
    const d=newVal-prev.sessions;
    toast(`${c.name}: ${prev.sessions} → ${newVal}`+(kind==='dec'?' · списана':d>0?' · добавлено':''),'Отменить',()=>changeClient(id,prev.sessions,'undo',prev));
  }
}
function flushClient(id){
  const p=pending[id];delete pending[id];
  const c=S.data.clients[id];if(!p||!c)return;
  const history=p.delta?[{at:p.fields.updatedAt,d:p.delta,v:p.fields.sessions},...(c.history||[])].slice(0,50):(c.history||[]);
  Back.put('clients',id,{...c,...p.fields,history});
}
function decClient(id,force){
  const c=clientView(S.data.clients[id]);
  if(!force&&isToday(c.lastMinusAt)){S.confirm=id;render();return}
  changeClient(id,(+c.sessions||0)-1,'dec');
}

    panel.addEventListener('focusout',e=>{if(e.target.id==='cn-memo'&&e.target.dataset.cid===id){clearTimeout(memoT);saveMemo(e.target.value)}});
    panel.onchange=e=>{
      if(e.target.id!=='i-file'||!e.target.files[0])return;

    };
    panel.onclick=e=>{
      const b=e.target.closest('[data-w],[data-cv],[data-wid],[data-irm],[data-ndel]');if(!b)return;
      if(b.dataset.ndel){const c=S.data.clients[id];Back.put('clients',id,{...c,notes:(c.notes||[]).filter(n=>n.id!==b.dataset.ndel)});draw();return}
      if(b.dataset.cv){view=b.dataset.cv;draw();return}

      if(b.dataset.irm!=null){imp.items.splice(+b.dataset.irm,1);draw();return}

        case 'nadd':{const t=panel.querySelector('#cn-text').value.trim();if(!t){toast('Напишите заметку');return}
          const c=S.data.clients[id];Back.put('clients',id,{...c,notes:[...(c.notes||[]),{id:uid(),date:panel.querySelector('#cn-date').value||today(),text:t,at:Date.now()}]});draw();toast('Заметка сохранена');break}
        case 'back':view='log';editId=null;draw();break;
        case 'new':editId=null;sel=null;view='edit';draw();setTimeout(()=>panel.querySelector('#w-text')?.focus(),50);break;
        case 'import':view='import';imp=null;draw();break;
        case 'save':{
          const date=panel.querySelector('#w-date').value||today(),title=panel.querySelector('#w-title').value.trim(),text=panel.querySelector('#w-text').value.replace(/\s+$/,'');
          if(!title&&!text){toast('Напишите, что тренировали');return}
          const old=editId&&S.data.workouts[editId];
          Back.put('workouts',editId||uid(),{clientId:id,date,title,text,createdAt:old?old.createdAt:Date.now()});
          const dec=!editId&&panel.querySelector('#w-dec')?.checked;
          view='log';editId=null;draw();
          if(dec){const cv=clientView(S.data.clients[id]);changeClient(id,(+cv.sessions||0)-1,'dec')}
          else toast('Тренировка сохранена');
          draw();break;
        }
        case 'del':{
          if(!arm(b,'Нажмите ещё раз, чтобы удалить'))return;
          const wid=editId,copy={...S.data.workouts[wid]};Back.del('workouts',wid);view='log';editId=null;draw();
          toast('Тренировка удалена','Вернуть',()=>{Back.put('workouts',wid,copy);draw()});break;
        }
        case 'parse':{
          raw=panel.querySelector('#i-text').value;
          if(!raw.trim()){toast('Сначала вставьте текст из заметок');return}
          const res=parseNotes(raw,new Date()),have=new Set(workouts().map(w=>w.date+'|'+w.text));
          const items=res.items.filter(it=>!have.has(it.date+'|'+it.text));
          imp={items,skipped:res.skipped,dup:res.items.length-items.length};draw();
          panel.querySelector('h2')?.scrollIntoView({behavior:'smooth',block:'start'});break;
        }
        case 'doimport':{
          const now=Date.now(),n=imp.items.length;
          Back.putMany('workouts',imp.items.map((it,i)=>[uid()+i,{clientId:id,date:it.date,title:cap(it.title),text:it.text,createdAt:now+i}]));
          imp=null;raw='';view='log';draw();toast('Добавлено тренировок: '+n);break;
        }
        case 'rename':{const name=panel.querySelector('#e-name').value.trim();
          if(name&&name!==c.name)Back.put('clients',id,{...c,name});toast('Сохранено');draw();break}
        case 'cdel':{
          if(!arm(b,'Нажмите ещё раз, чтобы удалить'))return;
          const copy={...c};Back.del('clients',id);closeSheet();
          toast('Клиент удалён','Вернуть',()=>Back.put('clients',id,copy));break;
        }
      }
    };
  });
}

/* Split pasted notes into dated workouts: every line that starts with a date opens a new entry */
const MON_PREFIX=[['янв',0],['фев',1],['мар',2],['апр',3],['мая',4],['май',4],['июн',5],['июл',6],['авг',7],['сен',8],['окт',9],['ноя',10],['дек',11]];
function parseDateLine(line,ref){
  const s=line.replace(/^[\s\-–—•*#>•\u{1F300}-\u{1FAFF}☀-➿]+/u,'');
  let d,mo,y,rest,m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+m[1];mo=+m[2]-1;d=+m[3];rest=s.slice(m[0].length)}
  else if((m=s.match(/^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{4}|\d{2}))?(?![\d.,\/])/))){
    d=+m[1];mo=+m[2]-1;y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):null;rest=s.slice(m[0].length);
    // "12.5 кг", "3.5x10" are weights, not dates
    if(!m[3]&&/^\s*(кг|kg|г\b|x|х|×|\*|раз|повт|подх|см|мин|сек|%)/i.test(rest))return null;
  }
  else if((m=s.match(/^(\d{1,2})\s+([а-яё]+)\.?(?:\s+(\d{4}))?/i))){
    const w=m[2].toLowerCase(),hit=MON_PREFIX.find(([p])=>w.startsWith(p));
    if(!hit)return null;
    d=+m[1];mo=hit[1];y=m[3]?+m[3]:null;rest=s.slice(m[0].length);
  }
  else return null;
  if(mo<0||mo>11||d<1||d>31)return null;
  if(y==null){y=ref.getFullYear();if(new Date(y,mo,d)>new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()+1))y--}
  const dt=new Date(y,mo,d);if(dt.getMonth()!==mo)return null;
  const p=n=>String(n).padStart(2,'0');
  return {date:`${y}-${p(mo+1)}-${p(d)}`,title:rest.replace(/^[\s\-–—:.,;)|\/]+/,'').replace(/^(г\.?|года?)(\s|$)/i,'').replace(/^[\s\-–—:.,;)|\/]+/,'').trim()};
}
function parseNotes(text,ref){
  const items=[];let cur=null,skipped=0;
  for(const raw of String(text).replace(/\r/g,'').split('\n')){
    const hit=parseDateLine(raw,ref||new Date());
    if(hit){cur={date:hit.date,title:hit.title.slice(0,80),lines:[]};items.push(cur);continue}
    if(cur)cur.lines.push(raw.trimEnd());else if(raw.trim())skipped++;
  }
  for(const it of items){
    while(it.lines.length&&!it.lines[0].trim())it.lines.shift();
    while(it.lines.length&&!it.lines[it.lines.length-1].trim())it.lines.pop();
    it.text=it.lines.join('\n');delete it.lines;
  }
  return {items:items.filter(it=>it.title||it.text),skipped};
}

/* ---------- notes, like the phone's Notes app: first line is the title ---------- */
const noteTitle=n=>(n.text||'').split('\n').find(l=>l.trim())||'Новая заметка';
const noteSub=n=>{const ls=(n.text||'').split('\n').filter(l=>l.trim());return ls[1]||'Нет текста'};
function noteDate(ts){const d=new Date(ts);if(ymd(d)===today())return hm(d);const y=new Date();y.setDate(y.getDate()-1);if(ymd(d)===ymd(y))return 'вчера';return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)}

    <b>${esc(noteTitle(n))}</b><small><span class="num">${noteDate(n.updatedAt||n.createdAt)}</span> ${esc(noteSub(n))}</small></button>`).join('')}</div>

}
function openNoteEd(id){

/* ---------- calendar ---------- */
const EV_COLORS=[['def','var(--accent)','Цвет темы'],['tomato','#BF6457','Терракота'],['flamingo','#C77B92','Пыльная роза'],['tangerine','#C98A55','Карамель'],['banana','#B79B4E','Горчица'],['basil','#5E8C61','Шалфей'],['sage','#6A9E92','Мята'],['peacock','#5C86AD','Деним'],['lavender','#8A82BC','Лаванда'],['grape','#946896','Слива'],['graphite','#7E7672','Какао']];
const evColor=k=>(EV_COLORS.find(c=>c[0]===k)||EV_COLORS[0])[1];
const WD_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const FREQS=[['none','Не повторять'],['day','Каждый день'],['week','Каждую неделю'],['month','Каждый месяц'],['year','Каждый год']];
const REMINDERS=[['none','Без напоминания'],['0','В момент начала'],['10','За 10 минут'],['60','За час'],['1440','За день']];
const wdMon=d=>(d.getDay()+6)%7;
const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
const isRep=ev=>!!(ev.repeat&&ev.repeat.freq&&ev.repeat.freq!=='none');
const isDone=(ev,s)=>isRep(ev)?(ev.doneDates||[]).includes(s):!!ev.done;
function occursOn(ev,s){
  if(!ev.date||s<ev.date)return false;
  if(!isRep(ev))return s===ev.date;
  const r=ev.repeat;
  if(r.until&&s>r.until)return false;
  if((ev.skipDates||[]).includes(s))return false;
  const n=Math.max(1,+r.interval||1),a=parseDay(ev.date),b=parseDay(s);
  switch(r.freq){
    case 'day':return dayDiff(ev.date,s)%n===0;
    case 'week':{
      const days=r.days&&r.days.length?r.days:[wdMon(a)];if(!days.includes(wdMon(b)))return false;
      const wa=new Date(a);wa.setDate(a.getDate()-wdMon(a));const wb=new Date(b);wb.setDate(b.getDate()-wdMon(b));
      return Math.round((wb-wa)/(7*864e5))%n===0;
    }
    case 'month':return b.getDate()===a.getDate()&&((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())%n===0;
    case 'year':return b.getDate()===a.getDate()&&b.getMonth()===a.getMonth()&&(b.getFullYear()-a.getFullYear())%n===0;
  }
  return false;
}
function eventsOn(s){
  return Object.values(S.data.tasks).filter(ev=>occursOn(ev,s))
    .sort((a,b)=>(a.time?1:0)-(b.time?1:0)||(a.time||'').localeCompare(b.time||'')||(a.createdAt||0)-(b.createdAt||0));
}
function repeatLabel(ev){
  if(!isRep(ev))return '';
  const r=ev.repeat,n=Math.max(1,+r.interval||1);
  if(r.freq==='day')return n>1?`Каждые ${n} ${plural(n,['день','дня','дней'])}`:'Каждый день';
  if(r.freq==='week'){const d=(r.days&&r.days.length?r.days:[wdMon(parseDay(ev.date))]).slice().sort().map(i=>WD_SHORT[i]).join(', ');
    return (n>1?`Каждые ${n} ${plural(n,['неделю','недели','недель'])}`:'Каждую неделю')+': '+d}
  if(r.freq==='month')return (n>1?`Каждые ${n} ${plural(n,['месяц','месяца','месяцев'])}`:'Каждый месяц')+', '+parseDay(ev.date).getDate()+' числа';
  return n>1?`Каждые ${n} ${plural(n,['год','года','лет'])}`:'Каждый год';
}

/* rich text: only formatting tags survive, so shared notes can't carry scripts or links */
const FONT_FACES=['Onest','Lora','Caveat','JetBrains Mono'];
const RT_TAGS=new Set(['B','STRONG','I','EM','U','S','STRIKE','FONT','BR','DIV','P','UL','OL','LI','SPAN']);
function cleanHtml(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const walk=node=>{for(const ch of [...node.childNodes]){
    if(ch.nodeType===3)continue;
    if(ch.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH)$/i.test(ch.tagName)){ch.remove();continue}
    walk(ch);
    if(!RT_TAGS.has(ch.tagName)){ch.replaceWith(...ch.childNodes);continue}
    for(const a of [...ch.attributes]){
      const ok=ch.tagName==='FONT'&&((a.name==='face'&&FONT_FACES.includes(a.value))||(a.name==='size'&&/^[1-7]$/.test(a.value))||(a.name==='color'&&/^#[0-9a-f]{3,6}$/i.test(a.value)));
      if(!ok)ch.removeAttribute(a.name);
    }
  }};
  walk(t.content);return t.innerHTML;
}
const rtText=html=>{const t=document.createElement('template');t.innerHTML=html||'';return t.content.textContent.trim()};
let rtRange=null;
document.addEventListener('selectionchange',()=>{
  const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0),n=r.commonAncestorContainer;
  const el=n.nodeType===1?n:n.parentElement;if(el&&el.closest&&el.closest('.rt'))rtRange=r.cloneRange();
});
function richEditor(html,ph){
  const b=(cmd,label,title)=>`<button type="button" data-rt="${cmd}" aria-label="${title}">${label}</button>`;
  return `<div class="rt-wrap"><div class="rt-bar" role="toolbar" aria-label="Оформление текста">
    ${b('bold','<b>Ж</b>','Жирный')}${b('italic','<i>К</i>','Курсив')}${b('underline','<u>Ч</u>','Подчёркнутый')}${b('strikeThrough','<s>З</s>','Зачёркнутый')}
    <span class="sep"></span>
    <button type="button" data-rt-size="2" aria-label="Мелкий">A<small>−</small></button><button type="button" data-rt-size="3" aria-label="Обычный размер">A</button><button type="button" data-rt-size="5" aria-label="Крупный">A<small>+</small></button><button type="button" data-rt-size="6" aria-label="Очень крупный"><b>A</b><small>++</small></button>
    <span class="sep"></span>
    ${FONT_FACES.map(f=>`<button type="button" data-rt-font="${f}" style="font-family:'${f}'" aria-label="Шрифт ${f}">Аа</button>`).join('')}
    <span class="sep"></span>
    ${['#B5574B','#C98A55','#5E8C61','#5C86AD','#946896'].map(c=>`<button type="button" class="sw" data-rt-color="${c}" style="--c:${c}" aria-label="Цвет текста"></button>`).join('')}
    <span class="sep"></span>
    ${b('insertUnorderedList','• Список','Список')}${b('removeFormat','Сброс','Убрать оформление')}
  </div><div class="rt" contenteditable="true" data-ph="${esc(ph)}">${cleanHtml(html)}</div></div>`;
}
function bindRich(root){
  root.querySelectorAll('.rt-wrap').forEach(w=>{
    const bar=w.querySelector('.rt-bar'),ed=w.querySelector('.rt');
    bar.addEventListener('mousedown',e=>e.preventDefault());
    bar.addEventListener('click',e=>{
      const btn=e.target.closest('button');if(!btn)return;
      ed.focus();
      if(rtRange&&ed.contains(rtRange.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(rtRange)}
      try{document.execCommand('styleWithCSS',false,false)}catch(_){}
      if(btn.dataset.rt)document.execCommand(btn.dataset.rt,false,null);
      else if(btn.dataset.rtSize)document.execCommand('fontSize',false,btn.dataset.rtSize);
      else if(btn.dataset.rtFont)document.execCommand('fontName',false,btn.dataset.rtFont);
      else if(btn.dataset.rtColor)document.execCommand('foreColor',false,btn.dataset.rtColor);
    });
  });
}
const rtValue=root=>{const ed=root.querySelector('.rt');const h=cleanHtml(ed.innerHTML);return rtText(h)?h:''};

function weekStartOf(s){const d=parseDay(s);d.setDate(d.getDate()-wdMon(d));return ymd(d)}
function viewTasks(){
  const mode=S.calView||'month';
  return `<div class="top top-cal"><div class="seg seg-v">${[['month','Месяц'],['week','Неделя']].map(([k,l])=>`<button data-act="cal-view" data-v="${k}" class="${mode===k?'on':''}">${l}</button>`).join('')}</div></div>`
    +(mode==='week'?weekView():monthView());
}
function monthView(){
  const td=today(),key=S.calMonth,[y,m]=key.split('-').map(Number);
  const first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-wdMon(first));
  const cells=(wdMon(first)+new Date(y,m,0).getDate())>35?42:35;
  let h=`<section class="cal"><div class="head"><button class="icon-btn" data-act="c-prev" aria-label="Прошлый месяц">‹</button>
    <b>${monthName(key)}</b>${S.selDay!==td||key!==td.slice(0,7)?'<button class="link-btn" data-act="go-today">Сегодня</button>':''}
    <button class="icon-btn" data-act="c-next" aria-label="Следующий месяц">›</button></div><div class="grid">
    ${WD_SHORT.map((w,i)=>`<div class="wd ${i>4?'we':''}">${w}</div>`).join('')}`;
  for(let i=0;i<cells;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d),evs=eventsOn(s);
    h+=`<button class="dayc ${d.getMonth()!==m-1?'other':''} ${s===td?'today':''} ${s===S.selDay?'sel':''}" data-act="day" data-day="${s}" aria-label="${dayTitle(s)}${evs.length?', событий: '+evs.length:''}">
      <span class="dn">${d.getDate()}</span>${evs.slice(0,2).map(ev=>`<span class="lbl ${isDone(ev,s)?'done':''} ${!ev.color||ev.color==='def'?'def':''}" style="--c:${evColor(ev.color)}">${esc(ev.title)}</span>`).join('')}${evs.length>2?`<span class="more-n">+${evs.length-2}</span>`:''}</button>`;
  }
  h+=`</div></section><div class="h2row"><h2>${S.selDay===td?'Сегодня, ':''}${dayTitle(S.selDay)}</h2><span><button class="link-btn" data-act="day-open" data-day="${S.selDay}">Расписать</button> <button class="link-btn" data-act="ev-new" data-day="${S.selDay}">+ Событие</button></span></div>
  <form class="addtask" id="t-form"><input type="text" id="t-title" placeholder="Быстро добавить дело" autocomplete="off" enterkeyhint="done"><input type="time" id="t-time" aria-label="Время"><button aria-label="Добавить">+</button></form>`;
  const evs=eventsOn(S.selDay);
  h+=evs.length?`<div class="group">${evs.map(ev=>eventRow(ev,S.selDay)).join('')}</div>`:`<div class="empty">На этот день ничего нет</div>`;
  const note=S.data.daynotes[S.selDay];
  h+=`<h2>Заметка дня</h2>`+(note&&note.html?`<button class="note-card" data-act="note-open" data-day="${S.selDay}">${cleanHtml(note.html)}</button>`
    :`<button class="note-add" data-act="note-open" data-day="${S.selDay}">Написать заметку: планы, мысли, что угодно</button>`);
  if(S.selDay===td){
    const late=Object.values(S.data.tasks).filter(t=>!isRep(t)&&!t.done&&t.date<td).sort((a,b)=>a.date.localeCompare(b.date));
    if(late.length)h+=`<h2>Не сделано раньше</h2><div class="group">${late.map(t=>eventRow(t,t.date,true)).join('')}</div>`;
  }
  return h;
}
/* planner week: each day is split into morning / day / evening; lines are ordinary calendar events */
const PARTS=[['morning','Утро'],['day','День'],['evening','Вечер']];
const WD_FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function partOf(ev){if(ev.part)return ev.part;if(!ev.time)return 'day';return ev.time<'12:00'?'morning':ev.time<'17:00'?'day':'evening'}
const itemText=ev=>(ev.time?ev.time.replace(':','.')+' ':'')+(ev.title||'');
function parseLine(str){
  const m=String(str).match(/^\s*(\d{1,2})[.:](\d{2})(?:\s+|$)(.*)$/);
  if(m&&+m[1]<24&&+m[2]<60)return {time:pad(+m[1])+':'+m[2],title:m[3].trim()};
  return {time:'',title:String(str).trim()};
}
const sortItems=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||(a.createdAt||0)-(b.createdAt||0);
// "more below" arrow on a day card, like the paper planner's
function updMore(b){b.parentElement.classList.toggle('has-more',b.scrollTop+b.clientHeight<b.scrollHeight-4)}
document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('pday-b'))updMore(t)},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pday'))e.target.click()});
function isoWeek(d){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-wdMon(d));const j=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-j)/864e5-3+wdMon(j))/7)}
function weekView(){
  const td=today(),ws=S.weekStart||weekStartOf(S.selDay),a=parseDay(ws),mid=new Date(a);mid.setDate(a.getDate()+3);
  const card=i=>{
    const d=new Date(a);d.setDate(a.getDate()+i);const s=ymd(d),evs=eventsOn(s),note=S.data.daynotes[s];
    const body=PARTS.map(([k,l])=>{
      const it=evs.filter(e=>partOf(e)===k).sort(sortItems);
      return `<span class="pp">${l}</span>`+it.map((e,j)=>{const dn=isDone(e,s);
        return `<span class="pl ${dn?'done':''}" style="--c:${evColor(e.color)}"><button class="pchk ${dn?'on':''}" data-act="t-toggle" data-id="${esc(e.id)}" data-day="${s}" aria-label="${dn?'Снять отметку':'Отметить сделанным'}">${dn?'✓':''}</button>${j+1}) <span class="hl">${esc(itemText(e))}</span></span>`}).join('')
        +'<span class="pl"></span>'.repeat(Math.max(1,2-it.length));
    }).join('');
    return `<div class="pday ${s===td?'today':''} ${i>4?'we short':''}" data-act="day-open" data-day="${s}" role="button" tabindex="0" aria-label="${dayTitle(s)}, открыть">
      <span class="pday-h"><span>${s===td?'<i class="tdot"></i>':''}${WD_FULL[i]} <b>${d.getDate()}</b></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4h6v6M20 4l-6 6M10 20H4v-6M4 20l6-6"/></svg></span>
      <div class="pday-b" data-sday="${s}">${body}${note&&note.html?`<div class="pnote">${cleanHtml(note.html)}</div>`:''}</div>
      <button class="pday-more" data-act="pday-down" aria-label="Листать ниже">⌄</button></div>`;
  };
  return `<section class="cal week-head"><div class="head" style="margin:0"><button class="icon-btn" data-act="w-prev" aria-label="Прошлая неделя">‹</button>
    <span class="wk-title"><b>${MONTHS[mid.getMonth()]} ${mid.getFullYear()}</b><small>Неделя ${isoWeek(a)}</small></span>
    ${ws!==weekStartOf(td)?'<button class="link-btn" data-act="go-today">Сегодня</button>':''}<button class="icon-btn" data-act="w-next" aria-label="Следующая неделя">›</button></div></section>
    <div class="wk-grid"><div class="wk-col">${[0,1,2].map(card).join('')}</div><div class="wk-col">${[3,4,5,6].map(card).join('')}<button class="wk-copy" data-act="week-copy" data-ws="${ws}">Повторить неделю</button></div></div>`;
}
function openDay(startDay){
  let s=startDay,colorFor=null;
  openSheet('<div id="dd"></div>',panel=>{
    panel.classList.add('full');
    const box=panel.querySelector('#dd');
    const saveNote=()=>{
      if(!box.querySelector('.rt'))return;
      const html=rtValue(box),cur=(S.data.daynotes[s]&&S.data.daynotes[s].html)||'';
      if(html===cur)return;
      if(html)Back.put('daynotes',s,{html,updatedAt:Date.now()});else Back.del('daynotes',s);
    };
    S.sheetClose=saveNote;
    const draw=focusPart=>{
      saveNote();
      const d=parseDay(s),idx=wdMon(d),evs=eventsOn(s),note=S.data.daynotes[s],td=today();
      const ws=parseDay(weekStartOf(s));
      let h=`<div class="dhead"><h3>${WD_FULL[idx]}, ${d.getDate()} ${MG[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}</h3>
        <button class="dclose" data-dclose="1" aria-label="Закрыть">×</button></div>
        <div class="wstrip"><button class="wsnav" data-dweek="-7" aria-label="Прошлая неделя">‹</button>`;
      for(let i=0;i<7;i++){const x=new Date(ws);x.setDate(ws.getDate()+i);const xs=ymd(x);
        h+=`<button class="ws ${xs===s?'sel':''} ${xs===td?'today':''} ${i>4?'we':''}" data-dgo="${xs}"><small>${WD_SHORT[i]}</small><b>${x.getDate()}</b><i class="${eventsOn(xs).length?'':'none'}"></i></button>`}
      h+=`<button class="wsnav" data-dweek="7" aria-label="Следующая неделя">›</button></div><div class="paper">`;
      for(const [k,l] of PARTS){
        const it=evs.filter(e=>partOf(e)===k).sort(sortItems);
        h+=`<div class="pline pp2">${l}</div>`;
        it.forEach((e,j)=>{const dn=isDone(e,s);
          h+=`<div class="pline ${dn?'done':''}" style="--c:${evColor(e.color)}">
            <button class="pchk ${dn?'on':''}" data-dtoggle="${esc(e.id)}" aria-label="${dn?'Снять отметку':'Отметить сделанным'}">${dn?'✓':''}</button>
            <span class="pn">${j+1})</span><span class="pt"><span class="hl ed" contenteditable="true" spellcheck="false" data-edit="${esc(e.id)}">${esc(itemText(e))}</span></span>
            <button class="dot-btn sm" data-dcolor="${esc(e.id)}" aria-label="Цвет и удаление"></button><button class="pmore" data-dmore="${esc(e.id)}" aria-label="Повтор, время, заметка">⋯</button></div>`;
          if(colorFor===e.id)h+=`<div class="palette-row">${EV_COLORS.map(([ck,cc,cn])=>`<button class="sw ${(e.color||'def')===ck?'on':''}" data-setc="${ck}" data-cfor="${esc(e.id)}" style="--c:${cc}" aria-label="${cn}"></button>`).join('')}
            <button class="link-btn" data-ddel="${esc(e.id)}" style="color:var(--out)">Удалить${isRep(e)?' на этот день':''}</button></div>`;
        });
        h+=`<div class="pline add"><span class="pchk ghost"></span><span class="pn">${it.length+1})</span><span class="pt"><span class="ed" contenteditable="true" spellcheck="false" data-addp="${k}" data-ph="${it.length?'':'например, 08.30 Ирина'}"></span></span></div><div class="pline"></div>`;
      }
      h+=`${richEditor(note&&note.html,'Заметка: планы, мысли, что угодно…')}
        <div class="pline"></div><div class="pline"></div><div class="pline"></div></div>`;
      box.innerHTML=h;bindRich(box);
      if(focusPart){const f=box.querySelector(`[data-addp="${focusPart}"]`);if(f){f.focus()}}
    };
    const commitEdit=el=>{
      const ev=S.data.tasks[el.dataset.edit];if(!ev)return false;
      const v=parseLine(el.textContent);
      if(!v.title&&!v.time){el.textContent=itemText(ev);toast('Чтобы удалить, нажмите цветной кружок → «Удалить»');return false}
      if(v.title===ev.title&&v.time===(ev.time||''))return false;
      Back.put('tasks',ev.id,{...ev,title:v.title,time:v.time,part:partOf(ev)});
      return v.time!==(ev.time||'');
    };
    const commitAdd=el=>{
      const v=parseLine(el.textContent);if(!v.title&&!v.time)return false;
      Back.put('tasks',uid(),{title:v.title,date:s,time:v.time,timeEnd:'',part:el.dataset.addp,color:'def',repeat:{freq:'none'},reminder:'none',notes:'',done:false,createdAt:Date.now()});
      return true;
    };
    draw();
    box.addEventListener('keydown',e=>{
      const t=e.target;if(e.key!=='Enter'||!t.classList||!t.classList.contains('ed'))return;
      e.preventDefault();
      if(t.dataset.addp){const k=t.dataset.addp;t.dataset.done='1';if(commitAdd(t))draw(k)}
      else{const k=partOf(S.data.tasks[t.dataset.edit]||{});t.dataset.done='1';const moved=commitEdit(t);if(moved)draw(k);else box.querySelector(`[data-addp="${k}"]`).focus()}
    });
    box.addEventListener('focusout',e=>{
      const t=e.target;if(!t.classList||!t.classList.contains('ed')||t.dataset.done)return;
      if(t.dataset.addp){if(commitAdd(t))setTimeout(()=>{if(!box.contains(document.activeElement)||document.activeElement===document.body)draw()},0)}
      else if(commitEdit(t))setTimeout(()=>draw(),0);
    });
    box.addEventListener('paste',e=>{
      if(!e.target.classList||!e.target.classList.contains('ed'))return;
      e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' '));
    });
    panel.onclick=e=>{
      const b=e.target.closest('[data-dtoggle],[data-dcolor],[data-setc],[data-dmore],[data-ddel],[data-dclose],[data-dgo],[data-dweek]');if(!b)return;
      const ds=b.dataset;
      if(ds.dtoggle){toggleEvent(ds.dtoggle,s);draw()}
      else if(ds.dgo){s=ds.dgo;colorFor=null;draw();panel.scrollTop=0}
      else if(ds.dweek){const x=parseDay(s);x.setDate(x.getDate()+ +ds.dweek);s=ymd(x);colorFor=null;draw()}
      else if(ds.dcolor){colorFor=colorFor===ds.dcolor?null:ds.dcolor;draw()}
      else if(ds.setc){const ev=S.data.tasks[ds.cfor];if(ev)Back.put('tasks',ds.cfor,{...ev,color:ds.setc,part:partOf(ev)});colorFor=null;draw()}
      else if(ds.dmore){saveNote();S.sheetClose=null;closeSheet();openEvent(ds.dmore,s)}
      else if(ds.ddel){
        const id=ds.ddel,ev=S.data.tasks[id];if(!ev)return;colorFor=null;
        if(isRep(ev))Back.put('tasks',id,{...ev,skipDates:[...(ev.skipDates||[]),s]});else Back.del('tasks',id);
        draw();toast('Запись удалена','Вернуть',()=>{Back.put('tasks',id,ev);if(!$('#sheet').hidden)draw()});
      }
      else if(ds.dclose)closeSheet();
    };
  });
}
function eventRow(ev,s,late){
  const done=isDone(ev,s),d=late?parseDay(ev.date):null;
  const meta=[late?d.getDate()+' '+MG[d.getMonth()]:'',ev.time?(ev.timeEnd?ev.time+'–'+ev.timeEnd:ev.time):'',isRep(ev)?'↻ '+repeatLabel(ev):'',ev.notes&&rtText(ev.notes)?'есть заметка':''].filter(Boolean).join(' · ');
  return `<div class="ev ${done?'done':''} ${!ev.color||ev.color==='def'?'def':''}" style="--c:${evColor(ev.color)}">
    <button class="check ${done?'on':''}" data-act="t-toggle" data-id="${esc(ev.id)}" data-day="${s}" aria-label="${done?'Отметить невыполненным':'Отметить выполненным'}">${done?'✓':''}</button>
    <button class="ev-main" data-act="ev-open" data-id="${esc(ev.id)}" data-day="${s}"><b>${esc(ev.title)}</b>${meta?`<small class="${late?'late':''}">${esc(meta)}</small>`:''}</button></div>`;
}
function toggleEvent(id,s){
  const ev=S.data.tasks[id];if(!ev)return;
  if(isRep(ev)){const dd=new Set(ev.doneDates||[]);dd.has(s)?dd.delete(s):dd.add(s);Back.put('tasks',id,{...ev,doneDates:[...dd]})}
  else Back.put('tasks',id,{...ev,done:!ev.done});
}

const SKINS=[['pudra','Пудра','#F4EDE9','#B0707B','#F2E1E2'],['denim','Деним','#F0EEE9','#5B7C9C','#E2E9F0'],['cocoa','Какао','#F3ECE3','#8A6950','#EEE2D4'],['pine','Хвоя','#EEEFE8','#4D6D57','#E0EAE1']];

const getTone=()=>{try{return {bg:100,sat:100,card:null,...JSON.parse(localStorage.getItem(LS_KEY+':tone')||'{}')}}catch(e){return {bg:100,card:null}}};
// light mode only: background 0 = white, 100 = the theme as designed, 200 = deep; cards 0 = white, 100 = background colour
const RELATIVE_OK=(()=>{try{return CSS.supports('color','oklch(from red l c h)')}catch(e){return false}})();
// light mode only. bg: 0 white · 100 as designed · 200 deep. sat: 0 grey · 100 as designed · 200 vivid. cards: 0 white · 100 background colour
function applyTone(t){
  const b=+t.bg,k=(+t.sat||100)/100,sat=RELATIVE_OK&&k!==1;
  let bg=b===100?'var(--skin-bg)':b<100?`color-mix(in srgb,var(--skin-bg) ${b}%,#FFFFFF)`:`color-mix(in srgb,var(--skin-bg),var(--skin-accent) ${Math.round((b-100)*0.55)}%)`;
  let css='';
  if(sat){
    bg=`oklch(from ${bg} l calc(c * ${k}) h)`;
    const ac=`oklch(from var(--skin-accent) l calc(c * ${k}) h)`;
    css+=`--accent:${ac};--accent-soft:color-mix(in srgb,${ac} 18%,#FFFFFF);--head:color-mix(in srgb,${ac} 26%,#FFFFFF);--line:color-mix(in srgb,${ac} 16%,var(--bg));`;
  }
  if(b!==100||sat)css+=`--bg:${bg};`;
  if(b<100)css+=`--bg-veil:rgba(255,255,255,${((100-b)/100).toFixed(2)});`;
  if(t.card!=null||sat||b!==100){const c=t.card==null?22:+t.card;css+=`--surface:color-mix(in srgb,var(--bg) ${c}%,#FFFFFF);--tile:color-mix(in srgb,var(--bg) ${Math.min(100,c+35)}%,#FFFFFF);`}
  let el=document.getElementById('tone-css');
  if(!el){el=document.createElement('style');el.id='tone-css';const c=document.getElementById('custom-bg');c?c.before(el):(document.head||document.body).appendChild(el)}
  el.textContent=css?`@media (prefers-color-scheme: light){html:root:not([data-theme="dark"]){${css}}}html:root[data-theme="light"]{${css}}`:'';
}

function applyColors(c){

  for(const k of ['head','paper']){
    f[k]?root.style.setProperty('--'+k,f[k].c):root.style.removeProperty('--'+k);
    f[k]&&f[k].img?root.style.setProperty('--'+k+'-img',f[k].img):root.style.removeProperty('--'+k+'-img');

// once a day the app keeps a copy of everything inside the phone; the last 7 days can be restored from settings
const SNAP=LS_KEY+':snap:';
function snapKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(SNAP))ks.push(k)}}catch(e){}return ks.sort().reverse()}
function autoSnapshot(){
  try{
    const has=Object.keys(S.data.tx).length+Object.keys(S.data.clients).length+Object.keys(S.data.tasks).length+Object.keys(S.data.notes||{}).length;
    const k=SNAP+today();if(!has||localStorage.getItem(k))return;
    localStorage.setItem(k,JSON.stringify({savedAt:Date.now(),data:S.data}));
    snapKeys().slice(7).forEach(x=>localStorage.removeItem(x));
  }catch(e){}
}
const lastBackup=()=>{try{return +localStorage.getItem(LS_KEY+':backup')||0}catch(e){return 0}};
async function saveBackup(){
  const body=JSON.stringify({app:'katya-notebook',version:1,savedAt:Date.now(),data:S.data});
  const name='katya-backup-'+today()+'.json';
  const done=()=>{try{localStorage.setItem(LS_KEY+':backup',String(Date.now()))}catch(e){};render(true);toast('Копия сохранена')};
  try{
    const file=new File([body],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Резервная копия'});done();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(new Blob([body],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);done();
  }catch(e){toast('Не получилось сохранить файл')}
}
