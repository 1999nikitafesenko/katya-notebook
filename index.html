function openSheet(html,mount){
  S.sheetClose=null;
  const p=$('#panel');p.classList.remove('full');p.onclick=null;p.oninput=null;p.onchange=null;p.onsubmit=null;
  p.innerHTML='<div class="grab"></div>'+html;$('#sheet').hidden=false;mount&&mount(p);
}
function closeSheet(){if(S.sheetClose){const f=S.sheetClose;S.sheetClose=null;f()}$('#sheet').hidden=true;$('#panel').innerHTML='';if(S.dirty)render()}
let toastT;
function toast(msg,action,fn){
  const el=$('#toast');clearTimeout(toastT);
  el.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:''}`;
  el.style.transition='';el.style.setProperty('--dx','0px');el.style.opacity='';
  el.hidden=false;
  if(action)el.querySelector('button').onclick=()=>{if(el.dataset.swiped)return;el.hidden=true;fn()};
  toastT=setTimeout(()=>el.hidden=true,action?5000:2200);
}

/* swipe gestures: the toast flicks away sideways, an open sheet pulls down to close */
(function(){
  const t=$('#toast');let x0=null,dx=0;
  t.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;dx=0;delete t.dataset.swiped;t.style.transition='none';clearTimeout(toastT)},{passive:true});
  t.addEventListener('touchmove',e=>{if(x0==null)return;dx=e.touches[0].clientX-x0;t.style.setProperty('--dx',dx+'px');t.style.opacity=String(Math.max(.2,1-Math.abs(dx)/260))},{passive:true});
  t.addEventListener('touchend',()=>{
    if(x0==null)return;x0=null;t.style.transition='transform .2s ease,opacity .2s ease';
    if(Math.abs(dx)>70){t.dataset.swiped='1';t.style.setProperty('--dx',(dx>0?1:-1)*window.innerWidth+'px');t.style.opacity='0';setTimeout(()=>{t.hidden=true;delete t.dataset.swiped},200)}
    else{t.style.setProperty('--dx','0px');t.style.opacity='';toastT=setTimeout(()=>t.hidden=true,3000)}
  });

  const sheet=$('#sheet'),panel=$('#panel');let y0=null,xs=0,dy=0,t0=0,drag=false;
  const skip=el=>el.closest('input,textarea,select,[contenteditable="true"],.cc-sw,.rt-bar,.palette-row');
  panel.addEventListener('touchstart',e=>{
    if(skip(e.target)&&!e.target.closest('.grab')){y0=null;return}
    y0=e.touches[0].clientY;xs=e.touches[0].clientX;dy=0;drag=false;t0=Date.now();
  },{passive:true});
  panel.addEventListener('touchmove',e=>{
    if(y0==null)return;
    const d=e.touches[0].clientY-y0,dx=e.touches[0].clientX-xs;
    if(!drag){
      if(panel.scrollTop>0||d<-8||(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(d))){y0=null;return}
      if(d<8)return;
      drag=true;panel.style.transition='none';
    }
    e.preventDefault();dy=Math.max(0,d);panel.style.transform=`translateY(${dy}px)`;
    sheet.querySelector('.scrim').style.opacity=String(Math.max(0,1-dy/400));
  },{passive:false});
  panel.addEventListener('touchend',()=>{
    if(!drag){y0=null;return}
    drag=false;y0=null;const fast=dy>40&&Date.now()-t0<250;
    panel.style.transition='transform .22s ease';
    const sc=sheet.querySelector('.scrim');sc.style.transition='opacity .22s ease';
    if(dy>110||fast){panel.style.transform='translateY(100%)';sc.style.opacity='0';
      setTimeout(()=>{closeSheet();panel.style.transform='';panel.style.transition='';sc.style.opacity='';sc.style.transition=''},210)}
    else{panel.style.transform='';sc.style.opacity='';setTimeout(()=>{panel.style.transition='';sc.style.transition=''},230)}
  });
})();

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab[data-tab]');
  if(tab){S.tab=tab.dataset.tab;S.confirm=null;try{localStorage.setItem(LS_KEY+':tab',S.tab)}catch(_){};render(true);scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=el.dataset.id;
  switch(el.dataset.act){
    case 'close':closeSheet();break;
    case 'skin':openSkin();break;
    case 'note-new':openNoteEd();break;
    case 'note-edit':openNoteEd(id);break;
    case 'backup-save':saveBackup();break;
    case 'm-prev':S.month=shiftMonth(S.month,-1);render(true);break;
    case 'm-next':S.month=shiftMonth(S.month,1);render(true);break;
    case 'tx-new':openTx();break;
    case 'tx-open':openTx(id);break;
    case 'budget':openBudget();break;
    case 'alloc':openAlloc(el.dataset.cat);break;
    case 'flow-start':{
      const v=parseInt(($('#s-start').value||'').replace(/\D/g,''),10);
      if(isNaN(v)){toast('Введите сумму, можно 0');$('#s-start').focus();break}
      const cur=today().slice(0,7);S.month=cur;Back.putFlow({active:cur,starts:{[cur]:v}});toast('Учёт начат');break}
    case 'flow-next':{
      const f=getFlow(),from=f.active,to=nextKey(from);
      if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Подтвердить: бюджет '+MG[+to.slice(5)-1]+' '+rub(+el.dataset.est);break}
      S.month=to;Back.putFlow({...f,active:to});scrollTo(0,0);
      toast('Начат '+MONTHS[+to.slice(5)-1].toLowerCase(),'Отменить',()=>{S.month=from;Back.putFlow({...f,active:from})});break}
    case 'tax':openTax();break;
    case 'env':openEnv(el.dataset.cat);break;
    case 'client-new':openClientNew();break;
    case 'client-open':openClient(id);break;
    case 'dec':decClient(id,false);break;
    case 'dec-force':decClient(id,true);break;
    case 'dec-cancel':S.confirm=null;render(true);break;
    case 'inc':{const c=clientView(S.data.clients[id]);changeClient(id,(+c.sessions||0)+1,'inc');break}
    case 'cal-view':S.calView=el.dataset.v;S.weekStart=weekStartOf(S.selDay);try{localStorage.setItem(LS_KEY+':cal',S.calView)}catch(_){};render(true);break;
    case 'w-prev':case 'w-next':{const d=parseDay(S.weekStart||weekStartOf(S.selDay));d.setDate(d.getDate()+(el.dataset.act==='w-next'?7:-7));S.weekStart=ymd(d);render(true);break}
    case 'day-open':openDay(el.dataset.day);break;
    case 'week-copy':{
      if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Скопировать на следующую неделю?';break}
      const ws=parseDay(el.dataset.ws),made=[],now=Date.now();
      for(let i=0;i<7;i++){
        const d=new Date(ws);d.setDate(ws.getDate()+i);const s=ymd(d);const n=new Date(d);n.setDate(d.getDate()+7);const ns=ymd(n);
        const have=eventsOn(ns).map(e=>partOf(e)+'|'+(e.time||'')+'|'+e.title);
        // repeating events already appear next week on their own
        for(const ev of eventsOn(s))if(!isRep(ev)&&!have.includes(partOf(ev)+'|'+(ev.time||'')+'|'+ev.title)){
          const id=uid()+made.length;made.push(id);
          Back.put('tasks',id,{...ev,id:undefined,date:ns,part:partOf(ev),done:false,doneDates:[],skipDates:[],createdAt:now+made.length});
        }
      }
      S.weekStart=ymd(new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7));render(true);scrollTo(0,0);
      toast(made.length?'Перенесено записей: '+made.length:'Нечего переносить: всё уже есть','Отменить',()=>{made.forEach(id=>Back.del('tasks',id))});break}
    case 'pday-down':{const bd=el.parentElement.querySelector('.pday-b');bd.scrollBy({top:96,behavior:'smooth'});break}
    case 'ev-new':openEvent(null,el.dataset.day);break;
    case 'ev-open':openEvent(id,el.dataset.day);break;
    case 'note-open':openNote(el.dataset.day);break;
    case 'c-prev':S.calMonth=shiftMonth(S.calMonth,-1);render(true);break;
    case 'c-next':S.calMonth=shiftMonth(S.calMonth,1);render(true);break;
    case 'day':S.selDay=el.dataset.day;if(S.selDay.slice(0,7)!==S.calMonth)S.calMonth=S.selDay.slice(0,7);render(true);break;
    case 'go-today':S.selDay=today();S.calMonth=S.selDay.slice(0,7);S.weekStart=weekStartOf(S.selDay);render(true);break;
    case 't-toggle':toggleEvent(id,el.dataset.day);break;
  }
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.set;
  if(id){const v=parseInt(e.target.value,10);e.target.blur();if(!isNaN(v))changeClient(id,v,'set');else render(true)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='n-search'){const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#n-list .note-row').forEach(r=>r.hidden=!!q&&!r.dataset.text.includes(q))}
  if(e.target.id==='c-search'){const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#c-list .client').forEach(r=>r.hidden=!!q&&!r.dataset.name.includes(q))}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='t-form')return;e.preventDefault();
  const title=$('#t-title').value.trim();if(!title){$('#t-title').focus();return}
  const time=$('#t-time').value;
  const keep=document.activeElement===$('#t-title');
  Back.put('tasks',uid(),{title,date:S.selDay,time:time||'',timeEnd:'',color:'def',repeat:{freq:'none'},reminder:'none',notes:'',done:false,createdAt:Date.now()});
  render(true);if(keep)$('#t-title').focus();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

render(true);
Back.init();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
